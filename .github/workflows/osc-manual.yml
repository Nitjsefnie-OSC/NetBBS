# Generic manual CI wrapper: dispatch with target_ref to test any branch.
name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or SHA to build and test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project with dev extras
        run: python -m pip install -e '.[dev]'
      - name: Provenance
        run: |
          echo "tested_target_ref=${{ inputs.target_ref }}"
          git rev-parse HEAD
      - name: Tests
        run: python -m pytest -q --tb=short -ra
